name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-host:
    name: Build ${{ matrix.target.rid }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - rid: win-x64
            os: windows
            runner: windows-latest
            binary: Prxy.exe
            archive: prxy-windows-x64.zip

          - rid: win-arm64
            os: windows
            runner: windows-latest
            binary: Prxy.exe
            archive: prxy-windows-arm64.zip

          - rid: linux-x64
            os: linux
            runner: ubuntu-latest
            binary: Prxy
            archive: prxy-linux-x64.tar.gz

          - rid: osx-arm64
            os: macos
            runner: macos-latest
            binary: Prxy
            archive: prxy-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Native AOT dependencies
        if: matrix.target.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Native AOT binary
        run: dotnet publish -c Release -r ${{ matrix.target.rid }} -o ./out

      - name: Package Windows archive
        if: matrix.target.os == 'windows'
        shell: pwsh
        run: Compress-Archive -Path ./out/${{ matrix.target.binary }} -DestinationPath ./${{ matrix.target.archive }}

      - name: Package Unix archive
        if: matrix.target.os != 'windows'
        run: tar -czvf ./${{ matrix.target.archive }} -C ./out ${{ matrix.target.binary }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.rid }}
          path: ${{ matrix.target.archive }}
          if-no-files-found: error

  build-containers:
    name: Build ${{ matrix.target.rid }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - rid: linux-arm64
            container: mcr.microsoft.com/dotnet/sdk:10.0-noble-aot-arm64v8
            platform: linux/arm64
            binary: Prxy
            archive: prxy-linux-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: matrix.target.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@v3

      - name: Build inside Native AOT container
        run: |
          docker run --rm \
            --platform ${{ matrix.target.platform }} \
            -v ${{ github.workspace }}:/src \
            -w /src \
            ${{ matrix.target.container }} \
            dotnet publish -c Release -r ${{ matrix.target.rid }} -o /src/out-${{ matrix.target.rid }}

      - name: Package container archive
        run: tar -czvf ./${{ matrix.target.archive }} -C ./out-${{ matrix.target.rid }} ${{ matrix.target.binary }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target.rid }}
          path: ${{ matrix.target.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-host, build-containers ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Publish Release with Assets
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*
          generate_release_notes: true
